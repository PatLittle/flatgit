name: Generate FlatGit test content

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: test-content/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: test-content/package-lock.json

      - name: Install document tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc fonts-dejavu-core

      - name: Install Python dependencies
        run: pip install --requirement test-content/requirements.txt

      - name: Install browser
        run: python -m playwright install --with-deps chromium

      - name: Install presentation dependencies
        run: npm ci --prefix test-content

      - name: Generate test content
        run: python test-content/generate_test_content.py

      - name: Summarize generated files
        run: |
          find test-content/generated -maxdepth 1 -type f -printf '%f %s bytes\n' | sort

      - name: Commit regenerated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-content/generated
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "Regenerate FlatGit test content"
          git push
